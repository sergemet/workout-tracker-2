
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Трекер тренировок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#17181A;
  --card:#212226;
  --card-2:#2A2B30;
  --line:#34363B;
  --text:#EDEAE5;
  --muted:#9B9B95;
  --rust:#C1440E;
  --rust-dim:#7A2C0A;
  --steel:#4E7C9B;
  --ok:#7DA37E;
  --warn:#D9A441;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  padding-bottom:90px;
  -webkit-tap-highlight-color:transparent;
}

header{
  padding:22px 18px 16px;
  border-bottom:1px solid var(--line);
  max-width:640px;
  margin:0 auto;
}
header h1{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:24px;
  letter-spacing:0.3px;
  margin:0 0 2px;
  text-transform:uppercase;
}
header p{
  margin:0 0 12px;
  color:var(--muted);
  font-size:13px;
}
.bw-setting{
  display:flex;
  align-items:center;
  gap:8px;
}
.bw-setting label{
  font-size:12px;
  color:var(--muted);
}
.bw-setting input{
  width:60px;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:7px;
  padding:6px 8px;
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  text-align:center;
}
.bw-setting span{
  font-size:12px;
  color:var(--muted);
}
.sync-status{
  margin:8px 0 0;
  font-size:11.5px;
  display:flex;
  align-items:center;
  gap:6px;
}
.sync-status .dot{
  width:7px;height:7px;
  border-radius:50%;
  background:var(--muted);
  flex-shrink:0;
}
.sync-status.on{color:var(--ok);}
.sync-status.on .dot{background:var(--ok);}
.sync-status.off{color:var(--muted);}
.sync-status.off .dot{background:var(--muted);}

nav{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  overflow-x:auto;
  max-width:640px;
  margin:0 auto;
  width:100%;
}
nav button{
  flex:1;
  min-width:84px;
  background:none;
  border:none;
  color:var(--muted);
  font-family:'Oswald',sans-serif;
  font-size:12.5px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.4px;
  padding:14px 6px 12px;
  border-bottom:3px solid transparent;
  cursor:pointer;
}
nav button.active{
  color:var(--text);
  border-bottom-color:var(--rust);
}
nav button.add-day-btn{
  flex:0 0 44px;
  min-width:44px;
  color:var(--rust);
  font-size:16px;
}

main{padding:16px;max-width:640px;margin:0 auto;}

.day-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:14px;
  gap:10px;
}
.day-date label{
  font-size:12px;
  color:var(--muted);
  display:block;
  margin-bottom:4px;
}
.day-date input[type="date"]{
  background:var(--card);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:8px;
  padding:8px 10px;
  font-family:'Inter',sans-serif;
  font-size:14px;
}
.edit-toggle-btn{
  background:var(--card-2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:8px;
  padding:9px 12px;
  font-size:12px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  white-space:nowrap;
  flex-shrink:0;
}
.edit-toggle-btn.active{
  border-color:var(--rust);
  color:var(--rust);
}
.day-delete-row{
  margin:-6px 0 14px;
}
.day-delete-btn{
  width:100%;
  background:none;
  border:1px dashed var(--rust-dim);
  color:var(--rust);
  border-radius:8px;
  padding:9px;
  font-size:12px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
}
.day-delete-btn.confirming{
  background:var(--rust);
  color:#fff;
  border-style:solid;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px 14px 10px;
  margin-bottom:12px;
}
.ex-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-bottom:2px;
}
.ex-name{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:15.5px;
  line-height:1.25;
}
.ex-name-input{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:15.5px;
  line-height:1.25;
  background:var(--card-2);
  border:1px solid var(--rust-dim);
  color:var(--text);
  border-radius:6px;
  padding:4px 8px;
  flex:1 1 auto;
  min-width:0;
}
.ex-name-input:focus{outline:none;border-color:var(--rust);}
.ex-tag{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:0.5px;
  color:var(--rust);
  border:1px solid var(--rust-dim);
  border-radius:5px;
  padding:2px 6px;
  white-space:nowrap;
  flex-shrink:0;
}
.ex-delete-btn{
  background:none;
  border:none;
  color:var(--rust);
  font-size:11.5px;
  padding:0;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  flex-shrink:0;
  margin-left:auto;
}
.ex-sub{
  color:var(--muted);
  font-size:12px;
  margin-bottom:2px;
}
.pr-badge{
  color:var(--warn);
  font-size:11.5px;
  margin-bottom:10px;
}

.round{
  border-top:1px solid var(--line);
  padding:9px 0;
}
.round:first-of-type{border-top:none;padding-top:4px;}
.round-label-line{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}
.round-label{
  font-size:11.5px;
  color:var(--muted);
  font-weight:500;
}
.round-del-btn{
  background:none;
  border:1px solid var(--rust-dim);
  color:var(--rust);
  width:18px;height:18px;
  border-radius:50%;
  font-size:12px;
  line-height:1;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.round-done-toggle{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--ok);
  cursor:pointer;
  user-select:none;
  margin-left:auto;
}
.round-done-toggle input{
  width:15px;height:15px;
  accent-color:var(--ok);
  margin:0;
}
.round.done .field, .round.done .bw-group{opacity:.5;}
.comp{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
  flex-wrap:wrap;
}
.comp:last-child{margin-bottom:0;}
.comp-label{
  font-size:12.5px;
  color:var(--text);
  flex:0 1 auto;
  max-width:150px;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.comp-target{
  color:var(--muted);
  font-size:11px;
  flex-shrink:0;
}
.field{
  display:flex;
  align-items:center;
  background:var(--card-2);
  border:1px solid var(--line);
  border-radius:7px;
  overflow:hidden;
  flex-shrink:0;
}
.field input{
  width:46px;
  background:none;
  border:none;
  color:var(--text);
  font-size:14px;
  padding:7px 4px;
  text-align:center;
  font-family:'Inter',sans-serif;
}
.field input:focus{outline:none;background:#33353b;}
.field span{
  font-size:10px;
  color:var(--muted);
  padding-right:6px;
}
.field.sep{border-left:1px solid var(--line);border-radius:0 7px 7px 0;}
.field.first{border-radius:7px 0 0 7px;}
.field.solo{border-radius:7px;}

.bw-group{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
  flex-wrap:wrap;
}
.bw-toggle{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  color:var(--steel);
  border:1px solid var(--steel);
  border-radius:20px;
  padding:5px 9px 5px 7px;
  cursor:pointer;
  user-select:none;
  flex-shrink:0;
}
.bw-toggle input{
  width:13px;height:13px;
  accent-color:var(--steel);
  margin:0;
}

.ex-editbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line);
}
.mini-btn{
  background:var(--card-2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:7px;
  padding:7px 10px;
  font-size:11.5px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
}
.mini-btn.danger{
  color:#E88A6A;
  border-color:var(--rust-dim);
}
.mini-btn.confirming{
  background:var(--rust);
  color:#fff;
  border-color:var(--rust);
}
.add-ex-btn{
  width:100%;
  background:var(--card);
  border:1px dashed var(--line);
  color:var(--muted);
  border-radius:10px;
  padding:13px;
  font-size:13px;
  cursor:pointer;
  margin-bottom:12px;
  font-family:'Inter',sans-serif;
}
.add-ex-form{
  display:none;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
}
.add-ex-form.open{display:block;}
.add-ex-form .field-label{
  font-size:11.5px;
  color:var(--muted);
  margin-bottom:4px;
  display:block;
}
.add-ex-form input[type="text"],
.add-ex-form input[type="number"]{
  width:100%;
  background:var(--card-2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:7px;
  padding:9px 10px;
  font-size:13.5px;
  margin-bottom:10px;
  font-family:'Inter',sans-serif;
}
.add-ex-form label.chk{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  color:var(--muted);
  margin-bottom:10px;
}
.comp-row{
  border-top:1px solid var(--line);
  padding-top:10px;
  margin-top:2px;
}
.comp-row-title{
  font-size:11px;
  color:var(--muted);
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:0.3px;
}
.form-actions{
  display:flex;
  gap:8px;
  margin-top:6px;
}
.form-actions button{
  flex:1;
  border-radius:7px;
  padding:10px;
  font-size:13px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  border:none;
}
.form-actions .primary{background:var(--rust);color:#fff;}
.form-actions .secondary{background:var(--card-2);color:var(--text);border:1px solid var(--line);}
.add-comp-btn{
  background:none;
  border:none;
  color:var(--steel);
  font-size:12px;
  cursor:pointer;
  padding:6px 0;
  font-family:'Inter',sans-serif;
}

.save-bar{
  position:fixed;
  bottom:0;left:0;right:0;
  background:linear-gradient(180deg, rgba(23,24,26,0) 0%, var(--bg) 35%);
  padding:22px 16px 16px;
  display:flex;
  gap:10px;
  max-width:640px;
  margin:0 auto;
}
.save-bar button{
  flex:1;
  background:var(--rust);
  color:#fff;
  border:none;
  border-radius:9px;
  padding:13px;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:14.5px;
  text-transform:uppercase;
  letter-spacing:0.4px;
  cursor:pointer;
}
.save-bar button:active{background:#9c3608;}
.save-bar button.share-day-btn{
  background:var(--card-2);
  border:1px solid var(--line);
  color:var(--text);
  flex:0.85;
}
.save-bar button.share-day-btn:active{background:#33353b;}

.toast{
  position:fixed;
  bottom:78px;
  left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--card-2);
  border:1px solid var(--line);
  color:var(--text);
  padding:10px 16px;
  border-radius:9px;
  font-size:13px;
  max-width:90%;
  opacity:0;
  transition:opacity .25s, transform .25s;
  pointer-events:none;
  text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast-undo-btn{
  background:none;
  border:none;
  color:var(--rust);
  font-weight:600;
  font-size:13px;
  padding:0;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  text-decoration:underline;
  pointer-events:auto;
}

.history-item{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:10px;
}
.history-item .hi-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}
.history-item .hi-date{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:14px;
}
.history-item .hi-day{
  color:var(--rust);
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
}
.history-item .hi-tonnage{
  color:var(--muted);
  font-size:12px;
}
.history-item .hi-detail{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--line);
  font-size:12.5px;
  color:var(--muted);
  display:none;
}
.history-item .hi-detail.open{display:block;}
.history-item .hi-detail div{margin-bottom:4px;}
.history-item .hi-detail b{color:var(--text);font-weight:500;}
.hi-editrow{margin-top:8px;}
.hi-actions{
  display:flex;
  gap:16px;
}
.hi-edit-btn, .hi-share-btn, .hi-delete-btn{
  background:none;
  border:none;
  color:var(--steel);
  font-size:11.5px;
  padding:0;
  cursor:pointer;
  font-family:'Inter',sans-serif;
}
.hi-share-btn{color:var(--rust);}
.hi-delete-btn{color:var(--rust);}
.hi-delete-btn.confirming{color:#fff;background:var(--rust);padding:2px 6px;border-radius:5px;}
.hi-edit-form{
  display:none;
  align-items:center;
  gap:8px;
  margin-top:8px;
}
.hi-edit-form.open{display:flex;}
.hi-edit-form input[type="date"]{
  background:var(--card-2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:7px;
  padding:6px 8px;
  font-family:'Inter',sans-serif;
  font-size:13px;
}
.hi-edit-form button{
  background:var(--steel);
  color:#fff;
  border:none;
  border-radius:7px;
  padding:6px 10px;
  font-size:12px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
}
.empty{
  color:var(--muted);
  font-size:13.5px;
  text-align:center;
  padding:40px 10px;
}
.progress-block{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  margin-bottom:16px;
}
.progress-block .pb-title{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:0.3px;
  margin-bottom:10px;
}
.progress-block select{
  width:100%;
  background:var(--card-2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:7px;
  padding:9px 10px;
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  margin-bottom:12px;
}
.progress-block .chart-wrap{
  position:relative;
  height:200px;
}
.progress-block .no-data{
  color:var(--muted);
  font-size:12.5px;
  text-align:center;
  padding:30px 0;
}
.share-chart-btn{
  width:100%;
  margin-top:12px;
  background:var(--card-2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:8px;
  padding:10px;
  font-size:12.5px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
}
</style>
</head>
<body>

<header>
  <h1>Точка железа</h1>
  <p>Программа от тренера · прогрессия и учёт по факту</p>
  <div class="bw-setting">
    <label>Твой вес</label>
    <input type="number" step="0.1" id="bwInput">
    <span>кг — используется для упражнений «свой вес»</span>
  </div>
  <p class="sync-status off" id="syncStatus"><span class="dot"></span>проверяю Telegram…</p>
</header>

<nav id="tabs"></nav>

<main id="main"></main>

<div class="save-bar" id="saveBar">
  <button id="shareDayBtn" class="share-day-btn">Поделиться днём</button>
  <button id="saveBtn">Сохранить тренировку</button>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_PROGRAM = [
  {
    id:'day1', label:'Грудь + Спина',
    exercises:[
      {id:'d1e1', name:'Подтягивания широким хватом (классика/резина)', sets:4,
        components:[{key:'a', label:'Повторения', target:'8-10', weight:true, bodyweightOption:true}]},
      {id:'d1e2', name:'Жим штанги лёжа на горизонтальной скамье', sets:4,
        components:[{key:'a', label:'', target:'8-10', weight:true}]},
      {id:'d1e3', name:'Тяга верхнего блока к груди', sets:3,
        components:[{key:'a', label:'', target:'10-12', weight:true}]},
      {id:'d1e4', name:'Жим гантелей на наклонной скамье (+30°)', sets:3,
        components:[{key:'a', label:'', target:'10-12', weight:true}]},
      {id:'d1e5', name:'Тяга нижнего блока', sets:3,
        components:[{key:'a', label:'', target:'10-12', weight:true}]},
      {id:'d1e6', name:'Сведение рук в тренажёре (пек-дек)', sets:3,
        components:[{key:'a', label:'', target:'12-15', weight:true}]},
      {id:'d1e7', name:'Пресс — суперсет: подъём коленей в висе + боковая планка', tag:'СУПЕРСЕТ', sets:3,
        components:[
          {key:'a', label:'Подъём коленей', target:'12-15', weight:true, bodyweightOption:true},
          {key:'b', label:'Планка вправо', target:'30 сек', weight:false},
          {key:'c', label:'Планка влево', target:'30 сек', weight:false}
        ]}
    ]
  },
  {
    id:'day2', label:'Ноги',
    exercises:[
      {id:'d2e1', name:'Приседания в Гакк-тренажёре', sets:4,
        components:[{key:'a', label:'', target:'8-12', weight:true}]},
      {id:'d2e2', name:'Румынская тяга со штангой', sets:3,
        components:[{key:'a', label:'', target:'10-12', weight:true}]},
      {id:'d2e3', name:'Суперсет: жим ногами + разгибание ног сидя', tag:'СУПЕРСЕТ', sets:3,
        components:[
          {key:'a', label:'Жим ногами', target:'12-15', weight:true},
          {key:'b', label:'Разгибание ног', target:'12-15', weight:true}
        ]},
      {id:'d2e4', name:'Сгибание ног лёжа в тренажёре', sets:3,
        components:[{key:'a', label:'', target:'12-15', weight:true}]},
      {id:'d2e5', name:'Подъём на носки стоя в тренажёре', sets:4,
        components:[{key:'a', label:'', target:'15-20', weight:true}]}
    ]
  },
  {
    id:'day3', label:'Дельты + Руки',
    exercises:[
      {id:'d3e1', name:'Пек-дек на заднюю дельту', tag:'ДРОПСЕТ', sets:4,
        components:[
          {key:'a', label:'Рабочий вес', target:'12-15', weight:true},
          {key:'b', label:'Дропсет (−20–30%)', target:'10-12', weight:true}
        ]},
      {id:'d3e2', name:'Жим штанги/гантелей вверх над головой сидя', sets:4,
        components:[{key:'a', label:'', target:'8-12', weight:true}]},

const STORE_KEY = 'ironpoint_tracker_v1';
const CLOUD_META_KEY = 'ip_meta';
const CLOUD_CHUNK_PREFIX = 'ip_chunk_'; // legacy, pre-double-buffer saves — kept for backward-compat reads
const CLOUD_CHUNK_PREFIX_A = 'ip_chunk_a_';
const CLOUD_CHUNK_PREFIX_B = 'ip_chunk_b_';
const CLOUD_CHUNK_SIZE = 3500;
const DEFAULT_BW = 81;

const tg = window.Telegram ? window.Telegram.WebApp : null;
if(tg){
  tg.ready();
  tg.expand();
}
function cloudAvailable(){
  return !!(tg && tg.CloudStorage);
}

function cloneDefaultProgram(){
  const obj = {};
  DEFAULT_PROGRAM.forEach(day=>{ obj[day.id] = JSON.parse(JSON.stringify(day)); });
  return obj;
}

function ensureStoreDefaults(s){
  if(!s.settings) s.settings = {bodyweight: DEFAULT_BW};
  if(s.settings.bodyweight == null) s.settings.bodyweight = DEFAULT_BW;
  if(!s.sessions) s.sessions = [];
  if(!s.lastByDay) s.lastByDay = {};
  if(!s.records) s.records = {};
  if(!s.bodyweightLog) s.bodyweightLog = [];
  if(!s.updatedAt) s.updatedAt = 0; // untimestamped/legacy data always loses to anything timestamped
  if(!s.program){
    // Genuinely fresh store: seed the default 3-day program.
    s.program = cloneDefaultProgram();
    s.dayOrder = DEFAULT_PROGRAM.map(d=>d.id);
  }
  if(!s.dayOrder || !s.dayOrder.length){
    // Older store that has a program but no explicit order yet (pre-dayOrder migration).
    // Never re-add day1/2/3 here — a missing default day means the user deleted it.
    s.dayOrder = Object.keys(s.program);
  }
  // Defensive: drop any dayOrder entries that no longer exist in program (e.g. after a delete).
  s.dayOrder = s.dayOrder.filter(id => !!s.program[id]);
  if(!s.dayOrder.length){
    // Only reached if program itself is somehow empty — recover rather than show a blank app.
    s.program = cloneDefaultProgram();
    s.dayOrder = DEFAULT_PROGRAM.map(d=>d.id);
  }
  return s;
}

function defaultStore(){
  return ensureStoreDefaults({});
}

function loadLocalStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      return ensureStoreDefaults(JSON.parse(raw));
    }
  }catch(e){}
  return defaultStore();
}

function saveLocalStore(s){
  localStorage.setItem(STORE_KEY, JSON.stringify(s));
}

function cloudGetItem(key){
  return new Promise((resolve, reject)=>{
    tg.CloudStorage.getItem(key, (err, value)=>{
      if(err) reject(err); else resolve(value);
    });
  });
}
function cloudSetItem(key, value){
  return new Promise((resolve, reject)=>{
    tg.CloudStorage.setItem(key, value, (err)=>{
      if(err) reject(err); else resolve();
    });
  });
}
function cloudRemoveItem(key){
  return new Promise((resolve, reject)=>{
    tg.CloudStorage.removeItem(key, (err)=>{
      if(err) reject(err); else resolve();
    });
  });
}

// Returns {found:true, store} when cloud data was read successfully,
// {found:false} when the cloud is genuinely empty (safe to seed it),
// {error:true} when the read itself failed (network, parse, missing chunk —
// never treat this the same as "empty", or a transient glitch could wipe good
// cloud data with a stale local copy).
let activeCloudPrefix = null;
let lastCloudChunkCount = 0;

async function cloudLoadStore(){
  let metaRaw;
  try{
    metaRaw = await cloudGetItem(CLOUD_META_KEY);
  }catch(e){
    return {error:true};
  }
  if(!metaRaw) return {found:false};
  try{
    const meta = JSON.parse(metaRaw);
    const prefix = meta.prefix || CLOUD_CHUNK_PREFIX; // old saves before the double-buffer scheme
    let json = '';
    for(let i=0; i<meta.count; i++){
      const part = await cloudGetItem(prefix + i);
      if(part == null) throw new Error('missing chunk ' + i);
      json += part;
    }
    const parsed = JSON.parse(json);
    activeCloudPrefix = prefix;
    lastCloudChunkCount = meta.count;
    return {found:true, store: ensureStoreDefaults(parsed)};
  }catch(e){
    return {error:true};
  }
}

// Double-buffered write: the brand-new, complete set of chunks is written under
// whichever prefix ISN'T currently active, and only once every one of those writes
// has succeeded does the single META key flip over to point at it. A crash or
// dropped connection at any point before that flip leaves the OLD prefix — still
// complete, still valid, still what META points to — entirely untouched.
async function cloudSaveStore(s){
  if(!cloudAvailable()) return;
  const json = JSON.stringify(s);
  const chunks = [];
  for(let i=0; i<json.length; i+=CLOUD_CHUNK_SIZE){
    chunks.push(json.slice(i, i+CLOUD_CHUNK_SIZE));
  }
  const oldPrefix = activeCloudPrefix || CLOUD_CHUNK_PREFIX_A;
  const newPrefix = oldPrefix === CLOUD_CHUNK_PREFIX_A ? CLOUD_CHUNK_PREFIX_B : CLOUD_CHUNK_PREFIX_A;
  const oldCount = lastCloudChunkCount;

  for(let i=0; i<chunks.length; i++){
    await cloudSetItem(newPrefix + i, chunks[i]);
  }
  await cloudSetItem(CLOUD_META_KEY, JSON.stringify({count: chunks.length, prefix: newPrefix}));

  activeCloudPrefix = newPrefix;
  lastCloudChunkCount = chunks.length;

  // Best-effort cleanup of the now-unreferenced old chunks. A failure here just
  // leaves harmless leftovers — META no longer points at them either way.
  if(oldPrefix !== newPrefix){
    for(let i=0; i<oldCount; i++){
      cloudRemoveItem(oldPrefix + i).catch(()=>{});
    }
  }
}

function saveStore(s){
  s.updatedAt = Date.now();
  saveLocalStore(s);
  if(cloudAvailable()){
    cloudSaveStore(s).catch(()=>{});
  }
}

function renderDay(dayId){
  captureOutgoingDraft();

  if(!day){

    saveBar.style.display = 'none';
    return;
  }
  const draft = drafts[dayId] || {};
  const last = (store.lastByDay[dayId]) || {};

  let html = `
    <div class="day-toolbar">
      <div class="day-date">
        <label>Дата тренировки</label>
        <input type="date" id="dateInput" value="${escapeHTML(currentDate)}">

    </div>` : ''}
  `;

  day.exercises.forEach(ex=>{
    const primaryComp = ex.components.find(c=>c.weight && !c.time);
    const rec = primaryComp ? store.records[`${ex.id}__${primaryComp.key}`] : null;
    const prHtml = rec ? `<div class="pr-badge">🏆 Рекорд: ${rec.weight}×${rec.reps}</div>` : '';

    html += `<div class="card">
      <div class="ex-head">

          ? `<input type="text" class="ex-name-input" value="${escapeHTML(ex.name)}" onblur="saveRenameInline('${dayId}','${ex.id}', this.value, this)" onkeydown="if(event.key==='Enter') this.blur()">`
          : `<div class="ex-name">${escapeHTML(ex.name)}</div>`}
        ${ex.tag ? `<div class="ex-tag">${escapeHTML(ex.tag)}</div>` : ''}
        ${dayEditMode ? `<button type="button" class="ex-delete-btn" onclick="requestDeleteExercise('${dayId}','${ex.id}', this)">Удалить</button>` : ''}
      </div>
      <div class="ex-sub">${ex.sets} подход${ex.sets===1?'':(ex.sets<5?'а':'ов')} · целевой диапазон см. ниже</div>
      ${prHtml}`;

    for(let s=1; s<=ex.sets; s++){
      const lastSet = last[ex.id] && last[ex.id][s];

      const effectiveSet = (draftSet && Object.keys(draftSet).length) ? draftSet : lastSet;
      const showLabel = ex.components.length > 1 || ex.sets > 1;
      const doneChecked = effectiveSet && effectiveSet.__done ? 'checked' : '';
      const canDeleteSet = dayEditMode && ex.sets > 1;
      const doneToggleHTML = `<label class="round-done-toggle"><input type="checkbox" data-doneref="${ex.id}__${s}" ${doneChecked}> выполнено</label>`;
      html += `<div class="round">
        ${showLabel ? `<div class="round-label-line"><span class="round-label">Подход ${s}</span>${canDeleteSet ? `<button type="button" class="round-del-btn" onclick="deleteSet('${dayId}','${ex.id}',${s})">×</button>` : ''}</div>` : ''}`;
      ex.components.forEach((comp, ci)=>{
        const placeholder = effectiveSet ? effectiveSet[comp.key] : null;
        const isLast = ci === ex.components.length - 1;
        html += `<div class="comp">
          <div class="comp-label">${escapeHTML(comp.label || 'Результат')}</div>
          <div class="comp-target">${escapeHTML(comp.target)}</div>
          ${fieldHTML(ex.id, s, comp, placeholder)}
          ${isLast ? doneToggleHTML : ''}
        </div>`;
      });
      html += `</div>`;
    }

    if(dayEditMode){
      html += `<div class="ex-editbar">
        <button type="button" class="mini-btn" onclick="adjustSets('${dayId}','${ex.id}',1)">+ подход</button>
      </div>`;
    }
    html += `</div>`;
  });

  if(dayEditMode){
    html += addExerciseFormHTML(dayId);
  }

  mainEl.innerHTML = html;
  domDayId = dayId;
  document.getElementById('dateInput').onchange = (e)=>{ currentDate = e.target.value; };
  document.getElementById('editModeBtn').onclick = ()=>{ dayEditMode = !dayEditMode; renderDay(dayId); };
  saveBar.style.display = 'flex';

  mainEl.querySelectorAll('[data-doneref]').forEach(cb=>{
    const round = cb.closest('.round');
    if(cb.checked && round) round.classList.add('done');
    cb.onchange = ()=>{ if(round) round.classList.toggle('done', cb.checked); };
  });

  if(dayEditMode){
    const ssCb = document.getElementById(`newExSuperset-${dayId}`);
    if(ssCb) ssCb.onchange = (e)=>{
      document.getElementById(`newExSimple-${dayId}`).style.display = e.target.checked ? 'none' : 'block';

    const cancelBtn = document.getElementById(`cancelNewExBtn-${dayId}`);
    if(cancelBtn) cancelBtn.onclick = ()=> document.getElementById(`addExForm-${dayId}`).classList.remove('open');
    const toggleBtn = document.getElementById(`toggleAddEx-${dayId}`);
    if(toggleBtn) toggleBtn.onclick = ()=> document.getElementById(`addExForm-${dayId}`).classList.toggle('open');
  }
}

function adjustSets(dayId, exId, delta){
  const day = getDay(dayId);
  const ex = day.exercises.find(e=>e.id===exId);
  if(!ex) return;
  const next = ex.sets + delta;
  if(next < 1){ showToast('Минимум один подход'); return; }
  ex.sets = next;
  saveStore(store);
  renderDay(dayId);
}
window.adjustSets = adjustSets;

function reindexSetsAfterDelete(dayData, exId, setIndex){
  if(!dayData) return;
  const exData = dayData[exId];
  if(!exData) return;
  const shifted = {};
  Object.keys(exData).sort((a,b)=>a-b).forEach(k=>{
    const num = Number(k);
    if(num < setIndex) shifted[num] = exData[k];
    else if(num > setIndex) shifted[num-1] = exData[k];
    // num === setIndex is the deleted set — dropped on purpose.
  });
  dayData[exId] = shifted;
}

function deleteSet(dayId, exId, setIndex){
  const day = getDay(dayId);
  const ex = day.exercises.find(e=>e.id===exId);
  if(!ex || ex.sets <= 1){ showToast('Должен остаться хотя бы один подход'); return; }

  // Capture whatever is live in the DOM right now (still under the OLD numbering)
  // before anything shifts, so typed-but-unsaved values move with the reindex too.
  if(domDayId === dayId){
    try{ drafts[dayId] = collectDayData(dayId).data; }catch(e){ drafts[dayId] = drafts[dayId] || {}; }
  }
  if(!store.lastByDay[dayId]) store.lastByDay[dayId] = {};

  reindexSetsAfterDelete(drafts[dayId], exId, setIndex);
  reindexSetsAfterDelete(store.lastByDay[dayId], exId, setIndex);

  ex.sets -= 1;
  saveStore(store);
  // Renders read from the freshly-reindexed draft above — tell renderDay not to
  // re-capture the (now stale, still-old-numbering) DOM over it.
  domDayId = null;
  renderDay(dayId);
}
window.deleteSet = deleteSet;

function requestDeleteExercise(dayId, exId, btn){
  if(btn.dataset.confirming === '1'){
    deleteExercise(dayId, exId);
    return;
  }
  btn.dataset.confirming = '1';
  btn.textContent = 'Точно? Ещё раз';
  btn.classList.add('confirming');
  setTimeout(()=>{
    if(btn.dataset.confirming === '1'){
      btn.dataset.confirming = '';
      btn.textContent = 'Удалить';
      btn.classList.remove('confirming');
    }
  }, 4000);
}
window.requestDeleteExercise = requestDeleteExercise;

function requestDeleteDay(dayId, btn){
  if(btn.dataset.confirming === '1'){
    deleteDay(dayId);

  }
  const day = getDay(dayId);
  btn.dataset.confirming = '1';
  btn.textContent = 'Точно удалить весь день? Ещё раз';
  btn.classList.add('confirming');
  setTimeout(()=>{
    if(btn.dataset.confirming === '1'){
      btn.dataset.confirming = '';
      btn.textContent = `Удалить весь день «${day.label}»`;
      btn.classList.remove('confirming');
    }
  }, 4000);
}

function deleteDay(dayId){
  if(store.dayOrder.length <= 1){
    showToast('Должен остаться хотя бы один тренировочный день');
    return;
  }
  const day = getDay(dayId);
  const label = day ? day.label : '';
  store.dayOrder = store.dayOrder.filter(id=>id!==dayId);
  delete store.program[dayId];
  delete store.lastByDay[dayId];
  delete drafts[dayId];
  saveStore(store);
  activeTab = store.dayOrder[0];
  dayEditMode = false;
  domDayId = null;
  showToast(`День «${label}» удалён. История тренировок за него осталась.`, 4200);
  render();
}

function escapeHTML(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function saveRenameInline(dayId, exId, value, inputEl){
  const val = value.trim();
  const day = getDay(dayId);
  const ex = day.exercises.find(e=>e.id===exId);
  if(!ex) return;
  if(!val){
    // Revert just this input, in place — no full re-render, so a click on a
    // neighbouring button (delete/add/done) that triggered this blur still lands
    // on the same element instead of one that just got replaced underneath it.
    if(inputEl) inputEl.value = ex.name;
    showToast('Название не может быть пустым');
    return;
  }
  if(val === ex.name) return;
  ex.name = val;
  saveStore(store);
  // No renderDay() here on purpose — the input already shows the new text,
  // nothing else on screen depends on the name, and re-rendering mid-blur is
  // exactly what caused buttons next to it to eat a click.
}
window.saveRenameInline = saveRenameInline;

function collectDayData(dayId){
  const day = getDay(dayId);
  if(!day) return {data:{}, hasAny:false};
  const bw = currentBW();
  const data = {};
  let hasAny = false;
  day.exercises.forEach(ex=>{
    data[ex.id] = {};
    for(let s=1; s<=ex.sets; s++){
      const setData = {};
      let setHasAny = false;
      ex.components.forEach(comp=>{
        const entry = {};
        if(comp.bodyweightOption){
          const name = `${ex.id}__${s}__${comp.key}`;
          const cb = document.querySelector(`[data-bwtoggle="${name}"]`);
          const isBW = cb ? cb.checked : true;
          const rEl = document.querySelector(`[data-field="${name}"][data-kind="reps"]`);
          const repsVal = (rEl && rEl.value !== '') ? Number(rEl.value) : null;
          if(isBW){
            const eEl = document.querySelector(`[data-field="${name}"][data-kind="extra"]`);
            const extraVal = (eEl && eEl.value !== '') ? Number(eEl.value) : 0;
            if(repsVal != null || extraVal){
              entry.bw = true;
              entry.extra = extraVal;
              entry.weight = bw + extraVal;
              if(repsVal != null) entry.reps = repsVal;
              setHasAny = true;
            }
          }else{
            const wEl = document.querySelector(`[data-field="${name}"][data-kind="weight"]`);
            const weightVal = (wEl && wEl.value !== '') ? Number(wEl.value) : null;
            if(weightVal != null){ entry.weight = weightVal; entry.bw = false; setHasAny = true; }
            if(repsVal != null){ entry.reps = repsVal; setHasAny = true; }
          }
        }else{
          if(comp.weight){
            const wEl = document.querySelector(`[data-field="${ex.id}__${s}__${comp.key}"][data-kind="weight"]`);
            if(wEl && wEl.value !== ''){ entry.weight = Number(wEl.value); setHasAny = true; }
          }
          const rEl = document.querySelector(`[data-field="${ex.id}__${s}__${comp.key}"][data-kind="reps"]`);
          if(rEl && rEl.value !== ''){ entry.reps = Number(rEl.value); setHasAny = true; }
        }
        if(Object.keys(entry).length) setData[comp.key] = entry;
      });
      const doneEl = document.querySelector(`[data-doneref="${ex.id}__${s}"]`);
      if(doneEl && doneEl.checked){ setData.__done = true; setHasAny = true; }
      if(setHasAny){ data[ex.id][s] = setData; hasAny = true; }
    }
  });
  return {data, hasAny};
}

function buildExerciseMeta(dayId, data){
  const day = getDay(dayId);
  const meta = {};
  day.exercises.forEach(ex=>{
    meta[ex.id] = {
      name: ex.name,
      tag: ex.tag || null,
      components: ex.components.map(c=>({key:c.key, label:c.label, target:c.target, weight:!!c.weight, time:!!c.time, bodyweightOption:!!c.bodyweightOption}))
    };
  });
  return meta;
}

function updateRecords(dayId, data){
  const day = getDay(dayId);
  const newRecords = [];
  day.exercises.forEach(ex=>{
    const exData = data[ex.id];
    if(!exData) return;
    ex.components.forEach(comp=>{
      if(!comp.weight || comp.time) return;
      let best = null;
      Object.values(exData).forEach(setData=>{
        const entry = setData[comp.key];
        if(entry && entry.weight != null && entry.reps != null){
          if(!best || entry.weight > best.weight || (entry.weight === best.weight && entry.reps > best.reps)) best = entry;
        }
      });
      if(!best) return;
      const key = `${ex.id}__${comp.key}`;
      const rec = store.records[key];
      if(!rec || best.weight > rec.weight || (best.weight === rec.weight && best.reps > rec.reps)){
        store.records[key] = {weight: best.weight, reps: best.reps, date: currentDate};
        newRecords.push({name: ex.name + (comp.label ? ` (${comp.label})` : ''), weight: best.weight, reps: best.reps});
      }
    });
  });
  return newRecords;
}

function tonnage(dayId, data){
  let total = 0;
  const day = getDay(dayId);
  day.exercises.forEach(ex=>{
    const exData = data[ex.id] || {};
    Object.values(exData).forEach(setData=>{
      Object.values(setData).forEach(entry=>{
        if(entry && typeof entry === 'object' && entry.weight != null && entry.reps != null){
          total += entry.weight * entry.reps;
        }
      });
    });
  });
  return Math.round(total);
}

function showToast(msg, ms=2600){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove('show'), ms);
}

let toastUndoHandler = null;
function showUndoToast(msg, undoFn, ms=5000){
  toastEl.innerHTML = '';
  const msgSpan = document.createElement('span');
  msgSpan.textContent = msg + ' ';
  const undoBtn = document.createElement('button');
  undoBtn.type = 'button';
  undoBtn.className = 'toast-undo-btn';
  undoBtn.textContent = 'Отменить';
  undoBtn.onclick = ()=>{
    toastEl.classList.remove('show');
    clearTimeout(showToast._t);
    if(toastUndoHandler){ toastUndoHandler(); toastUndoHandler = null; }
  };
  toastEl.appendChild(msgSpan);
  toastEl.appendChild(undoBtn);
  toastUndoHandler = undoFn;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ toastEl.classList.remove('show'); toastUndoHandler = null; }, ms);
}

function saveCurrentDay(){
  const dayId = activeTab;
  const {data, hasAny} = collectDayData(dayId);
  if(!hasAny){
    showToast('Пусто — заполни хоть один подход перед сохранением');
    return;
  }
  const dayLabel = getDay(dayId).label;
  const tons = tonnage(dayId, data);
  const newRecords = updateRecords(dayId, data);
  const exerciseMeta = buildExerciseMeta(dayId, data);
  logBodyweight(todayStr(), currentBW());

  const prevTonSessions = store.sessions
    .filter(s=>s.dayId===dayId && s.date!==currentDate)
    .sort((a,b)=> a.date < b.date ? 1 : -1);
  const prevTon = prevTonSessions.length ? prevTonSessions[0].tonnage : null;

  const existingIdx = store.sessions.findIndex(s=>s.dayId===dayId && s.date===currentDate);
  const session = {date: currentDate, dayId, dayLabel, data, tonnage: tons, exerciseMeta};
  if(existingIdx >= 0){
    store.sessions[existingIdx] = session;
  }else{
    store.sessions.push(session);
  }
  store.lastByDay[dayId] = data;
  saveStore(store);

  let note = 'Тренировка сохранена.';
  if(prevTon != null && tons > 0){
    if(tons > prevTon) note += ` Тоннаж вырос: ${prevTon} → ${tons} кг.`;
    else if(tons < prevTon) note += ` Тоннаж чуть ниже прошлого раза (${prevTon} → ${tons} кг).`;
    else note += ` Тоннаж на уровне прошлого раза (${tons} кг).`;
  }else{
    note += ` Тоннаж за сегодня: ${tons} кг.`;
  }
  if(newRecords.length){
    note += ' 🏆 Рекорд: ' + newRecords.map(r=>`${r.name} — ${r.weight}×${r.reps}`).join(', ');
  }
  showToast(note, 5400);
  renderDay(dayId);
}

function buildProgressSeries(value){
  const [kind, a, b] = value.split('__');
  if(kind === 'bodyweight'){
    return [...(store.bodyweightLog||[])].sort((e1,e2)=> e1.date < e2.date ? -1 : 1).map(e=>({date:e.date, value:e.weight}));
  }
  const sorted = [...store.sessions].sort((s1,s2)=> s1.date < s2.date ? -1 : 1);
  const points = [];
  if(kind === 'tonnage'){
    sorted.filter(s=>s.dayId===a).forEach(s=>{
      points.push({date:s.date, value:s.tonnage});
    });
  }else{
    sorted.forEach(s=>{
      const exData = s.data[a];
      if(!exData) return;
      let sum=0, count=0;
      Object.values(exData).forEach(setData=>{
        const entry = setData[b];
        if(entry && entry.weight != null){ sum += entry.weight; count++; }
      });
      if(count>0) points.push({date:s.date, value: Math.round((sum/count)*10)/10});
    });
  }
  return points;
}

function sessionExerciseList(session){
  if(session.exerciseMeta && Object.keys(session.exerciseMeta).length){
    return Object.keys(session.exerciseMeta).map(id=>({id, ...session.exerciseMeta[id]}));
  }
  const day = getDay(session.dayId);
  return day ? day.exercises : [];
}

function sessionDetailLines(session){
  const list = sessionExerciseList(session);
  const lines = [];
  list.forEach(ex=>{
    const exData = session.data[ex.id];
    if(!exData || !Object.keys(exData).length){
      lines.push({name: ex.name, text: '— пока пусто', pending: true});
      return;
    }
    const parts = [];
    Object.keys(exData).sort((a,b)=>a-b).forEach(setNum=>{
      const setData = exData[setNum];
      const compParts = [];
      ex.components.forEach(comp=>{
        const entry = setData[comp.key];
        if(!entry) return;
        if(entry.time != null) compParts.push(`${entry.time}с`);
        else if(entry.weight != null && entry.reps != null){
          const bwTag = entry.bw ? ' (св.вес)' : '';
          compParts.push(`${entry.weight}×${entry.reps}${bwTag}`);
        }
        else if(entry.reps != null) compParts.push(`${entry.reps}`);
      });
      if(compParts.length){
        let partStr = compParts.join('/');
        if(setData.__done) partStr = '✓ ' + partStr;
        parts.push(partStr);
      }
    });
    lines.push({name: ex.name, text: parts.length ? parts.join(', ') : '— пока пусто', pending: parts.length===0});
  });
  return lines;
}

function buildWorkoutSummaryText(session){
  const lines = sessionDetailLines(session);
  let text = `ТОЧКА ЖЕЛЕЗА\n${session.dayLabel} — ${formatDate(session.date)}\nТоннаж: ${session.tonnage} кг\n\n`;
  text += lines.map(l=>`${l.name}: ${l.text}`).join('\n');
  return text;
}

function buildChartShareText(){
  const select = document.getElementById('progressSelect');
  if(!select) return 'Точка железа — прогресс';
  const value = select.value;
  const label = select.options[select.selectedIndex].text;
  const points = buildProgressSeries(value);
  if(points.length < 2) return `ТОЧКА ЖЕЛЕЗА\n${label}: пока мало данных для тренда.`;
  const first = points[0], last = points[points.length-1];
  const diff = Math.round((last.value - first.value)*10)/10;
  const trend = diff > 0 ? `+${diff}` : `${diff}`;
  return `ТОЧКА ЖЕЛЕЗА — ПРОГРЕСС\n${label}\n${formatDate(first.date)}: ${first.value}\n${formatDate(last.date)}: ${last.value} (${trend})`;
}

async function ensureFontsReady(){
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
}

function wrapTextLines(ctx, text, maxWidth){
  const words = text.split(' ');
  const result = [];
  let line = '';
  words.forEach(word=>{
    const test = line ? line + ' ' + word : word;
    if(ctx.measureText(test).width > maxWidth && line){
      result.push(line);
      line = word;
    }else{
      line = test;
    }
  });
  if(line) result.push(line);
  return result;
}

async function buildWorkoutCardBlob(session){
  await ensureFontsReady();
  const lines = sessionDetailLines(session);
  const width = 720;
  const padding = 40;
  const headerHeight = 170;
  const lineHeight = 26;

  const tempCanvas = document.createElement('canvas');
  const tctx = tempCanvas.getContext('2d');
  tctx.font = '400 15px Inter, sans-serif';
  const maxTextWidth = width - padding*2;
  let totalLines = 0;
  const wrapped = lines.map(l=>{
    const full = `${l.name}: ${l.text}`;
    const wr = wrapTextLines(tctx, full, maxTextWidth);
    totalLines += wr.length;
    return { lines: wr, pending: !!l.pending };
  });

  const height = headerHeight + Math.max(totalLines,1)*lineHeight + padding;
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#17181A';
  ctx.fillRect(0,0,width,height);

  ctx.fillStyle = '#9B9B95';
  ctx.font = '600 13px Oswald, sans-serif';
  ctx.fillText('ТОЧКА ЖЕЛЕЗА', padding, 44);

  ctx.fillStyle = '#EDEAE5';
  ctx.font = '700 30px Oswald, sans-serif';
  ctx.fillText(session.dayLabel.toUpperCase(), padding, 84);

  ctx.fillStyle = '#9B9B95';
  ctx.font = '400 16px Inter, sans-serif';
  ctx.fillText(formatDate(session.date), padding, 112);

  ctx.fillStyle = '#C1440E';
  ctx.font = '700 20px Oswald, sans-serif';
  ctx.fillText(`${session.tonnage} кг тоннаж`, padding, 146);

  ctx.strokeStyle = '#34363B';
  ctx.beginPath(); ctx.moveTo(padding, headerHeight-14); ctx.lineTo(width-padding, headerHeight-14); ctx.stroke();

  let y = headerHeight + 14;
  ctx.font = '400 15px Inter, sans-serif';
  if(wrapped.length === 0){
    ctx.fillStyle = '#9B9B95';
    ctx.fillText('Нет данных', padding, y);
  }
  wrapped.forEach(item=>{
    item.lines.forEach((line, li)=>{
      if(item.pending) ctx.fillStyle = '#5F615F';
      else ctx.fillStyle = li===0 ? '#EDEAE5' : '#9B9B95';
      ctx.fillText(line, padding, y);
      y += lineHeight;
    });
  });

  return new Promise(resolve=> canvas.toBlob(resolve, 'image/png'));
}

async function buildChartShareBlob(){
  if(!progressChart) return null;
  await ensureFontsReady();
  const srcCanvas = progressChart.canvas;
  const headerHeight = 90;
  const canvas = document.createElement('canvas');
  canvas.width = srcCanvas.width;
  canvas.height = srcCanvas.height + headerHeight;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#17181A';

  ctx.font = '600 13px Oswald, sans-serif';

}

async function shareResult({ blob, filename, text, title }){
  try{
    if(blob && navigator.canShare){
      const file = new File([blob], filename, { type: blob.type });
      if(navigator.canShare({ files: [file] })){
        await navigator.share({ title, text, files: [file] });
        return;
      }
    }
  }catch(e){
    if(e && e.name === 'AbortError') return; // user cancelled the share sheet on purpose — leave it at that
    /* anything else (unsupported, real failure) — fall through to the next attempt */
  }

  try{
    if(navigator.share){
      await navigator.share({ title, text });
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;
    /* fall through to manual fallback */
  }

  if(blob){
    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 8000);
    }catch(e){}
  }
  try{
    if(text && navigator.clipboard){
      await navigator.clipboard.writeText(text);
      showToast(blob ? 'Картинка сохранена, текст скопирован — вставь в чат вручную' : 'Текст скопирован — вставь в чат вручную', 4200);
      return;
    }
  }catch(e){}
  showToast(blob ? 'Картинка сохранена — отправь её вручную' : 'Не получилось поделиться', 4200);
}

    document.getElementById('progressSelect').onchange = (e)=> renderProgressChart(e.target.value);
    renderProgressChart(opts[0].value);
    wireShareChartBtn();
    return;
  }

  sessions.forEach((s, idx)=>{
    const lines = sessionDetailLines(s);
    const detail = lines.map(l=>`<div><b>${escapeHTML(l.name)}:</b> ${escapeHTML(l.text)}</div>`).join('');
    html += `<div class="history-item">
      <div class="hi-top" onclick="toggleHistory(${idx})">
        <div>
          <div class="hi-date">${escapeHTML(formatDate(s.date))}</div>
          <div class="hi-day">${escapeHTML(s.dayLabel)}</div>
        </div>
        <div class="hi-tonnage">${s.tonnage} кг</div>
      </div>
      <div class="hi-detail" id="hi-detail-${idx}">${detail || 'Нет данных'}</div>
      <div class="hi-editrow">
        <div class="hi-actions">
          <button type="button" class="hi-edit-btn" id="editBtn-${idx}">изменить дату</button>
          <button type="button" class="hi-share-btn" id="shareBtn-${idx}">поделиться</button>
          <button type="button" class="hi-delete-btn" id="deleteSessionBtn-${idx}">удалить запись</button>
        </div>
        <div class="hi-edit-form" id="editForm-${idx}">
          <input type="date" id="editDateInput-${idx}" value="${escapeHTML(s.date)}">
          <button type="button" id="editSaveBtn-${idx}">Сохранить</button>
        </div>
      </div>
    </div>`;
  });
  mainEl.innerHTML = html;
  document.getElementById('progressSelect').onchange = (e)=> renderProgressChart(e.target.value);
  renderProgressChart(opts[0].value);
  wireShareChartBtn();

  sessions.forEach((s, idx)=>{
    const btn = document.getElementById('editBtn-'+idx);
    const form = document.getElementById('editForm-'+idx);
    const input = document.getElementById('editDateInput-'+idx);
    const saveBtn = document.getElementById('editSaveBtn-'+idx);
    const shareBtn = document.getElementById('shareBtn-'+idx);
    const deleteBtn = document.getElementById('deleteSessionBtn-'+idx);
    if(btn){
      btn.onclick = (e)=>{
        e.stopPropagation();
        form.classList.toggle('open');
      };
      saveBtn.onclick = (e)=>{
        e.stopPropagation();
        const newDate = input.value;
        if(!newDate) return;
        if(newDate === s.date) return;
        const dup = store.sessions.find(x => x !== s && x.dayId === s.dayId && x.date === newDate);
        if(dup){
          showToast('На эту дату уже есть запись для этого дня', 3200);
          return;
        }
        s.date = newDate;
        saveStore(store);
        showToast('Дата обновлена');
        renderHistory();
      };
    }
    if(deleteBtn){
      deleteBtn.onclick = (e)=>{
        e.stopPropagation();
        if(deleteBtn.dataset.confirming === '1'){
          const idx = store.sessions.indexOf(s);
          if(idx === -1) return;
          store.sessions.splice(idx, 1);
          saveStore(store);
          renderHistory();
          showUndoToast('Запись удалена.', ()=>{
            store.sessions.splice(idx, 0, s);
            saveStore(store);
            renderHistory();
          });
          return;
        }
        deleteBtn.dataset.confirming = '1';
        deleteBtn.textContent = 'точно? ещё раз';
        deleteBtn.classList.add('confirming');
        setTimeout(()=>{
          if(deleteBtn.dataset.confirming === '1'){
            deleteBtn.dataset.confirming = '';
            deleteBtn.textContent = 'удалить запись';
            deleteBtn.classList.remove('confirming');
          }
        }, 4000);
      };
    }
    if(shareBtn){
      shareBtn.onclick = async (e)=>{
        e.stopPropagation();
        const original = shareBtn.textContent;
        shareBtn.textContent = 'готовлю...';
        try{
          const blob = await buildWorkoutCardBlob(s);
          const text = buildWorkoutSummaryText(s);
          await shareResult({ blob, filename:`trenirovka-${s.date}.png`, text, title:`${s.dayLabel} — ${formatDate(s.date)}` });
        }catch(err){
          showToast('Не получилось подготовить — попробуй ещё раз');
        }
        shareBtn.textContent = original;
      };
    }
  });
}

function wireShareChartBtn(){
  const shareChartBtn = document.getElementById('shareChartBtn');
  if(!shareChartBtn) return;
  shareChartBtn.onclick = async ()=>{
    const original = shareChartBtn.textContent;
    shareChartBtn.textContent = 'готовлю...';
    try{
      const text = buildChartShareText();
      const blob = await buildChartShareBlob();
      await shareResult({ blob, filename:'progress.png', text, title:'Прогресс — Точка железа' });
    }catch(err){
      showToast('Не получилось подготовить — попробуй ещё раз');
    }
    shareChartBtn.textContent = original;
  };
}

function toggleHistory(idx){
  const el = document.getElementById(`hi-detail-${idx}`);
  if(el) el.classList.toggle('open');
}
window.toggleHistory = toggleHistory;

function formatDate(str){
  if(!str) return '';
  const [y,m,d] = str.split('-');
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${Number(d)} ${months[Number(m)-1]} ${y}`;
}

function render(){
  if(activeTab !== 'history' && activeTab !== '__addday__' && !getDay(activeTab)){
    // The remembered tab points at a day that no longer exists (deleted, or a stale
    // reference from before a cloud sync) — fall back to the first real day instead
    // of showing a dead "День не найден" screen.
    activeTab = store.dayOrder[0];
  }
  renderTabs();
  if(activeTab === 'history'){
    renderHistory();
  }else if(activeTab === '__addday__'){
    renderAddDay();
  }else{
    renderDay(activeTab);
  }
}

async function shareCurrentDay(){
  const dayId = activeTab;
  const {data, hasAny} = collectDayData(dayId);
  if(!hasAny){
    showToast('Нечем делиться — заполни хоть один подход');
    return;
  }
  const dayLabel = getDay(dayId).label;
  const tons = tonnage(dayId, data);
  const exerciseMeta = buildExerciseMeta(dayId, data);
  const session = { date: currentDate, dayId, dayLabel, data, tonnage: tons, exerciseMeta };

  const btn = document.getElementById('shareDayBtn');
  const original = btn.textContent;
  btn.textContent = 'готовлю...';
  try{
    const blob = await buildWorkoutCardBlob(session);
    const text = buildWorkoutSummaryText(session);
    await shareResult({ blob, filename:`trenirovka-${session.date}.png`, text, title:`${dayLabel} — ${formatDate(session.date)}` });
  }catch(err){
    showToast('Не получилось подготовить — попробуй ещё раз');
  }
  btn.textContent = original;
}
document.getElementById('shareDayBtn').onclick = shareCurrentDay;
document.getElementById('saveBtn').onclick = saveCurrentDay;

async function init(){
  store = loadLocalStore();
  bwInput.value = currentBW();
  render();

  if(cloudAvailable()){
    const result = await cloudLoadStore();
    if(result.error){
      // Couldn't confirm what's in the cloud — do NOT push local over it, a
      // transient glitch here should never be able to wipe good cloud data.
      syncStatusEl.className = 'sync-status off';
      syncStatusEl.innerHTML = '<span class="dot"></span>не удалось связаться с облаком — работаю локально';
    }else if(result.found){
      if((result.store.updatedAt || 0) > (store.updatedAt || 0)){
        // The cloud copy is genuinely newer (edited elsewhere) — adopt it.
        store = result.store;
        saveLocalStore(store);
        bwInput.value = currentBW();
        domDayId = null;
        render();
      }else{
        // Local is the same age or newer — the cloud copy is stale, most likely because
        // an earlier save's background push never finished. Never discard newer local
        // work just because the cloud answered first; push local up to catch cloud up.
        cloudSaveStore(store).catch(()=>{});
      }
      syncStatusEl.className = 'sync-status on';
      syncStatusEl.innerHTML = '<span class="dot"></span>Telegram Mini App — синхронизация включена';
    }else{
      // Genuinely empty cloud (confirmed, not just "couldn't check") — safe to seed it.
      cloudSaveStore(store).catch(()=>{});
      syncStatusEl.className = 'sync-status on';
      syncStatusEl.innerHTML = '<span class="dot"></span>Telegram Mini App — синхронизация включена';
    }
  }else{
    syncStatusEl.className = 'sync-status off';
    syncStatusEl.innerHTML = '<span class="dot"></span>локальный режим (открой через бота в Telegram для синхронизации)';
  }
}

init();
</script>
